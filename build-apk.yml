name: Build Auralis APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk auralis-debug.apk

      # Keep the zip artifact as a backup.
      - name: Upload universal APK (zip artifact)
        uses: actions/upload-artifact@v4
        with:
          name: auralis-universal-apk
          path: auralis-debug.apk
          if-no-files-found: error

      # Publish the APK as a plain .apk file on the Releases page (no zip).
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auralis debug build ${{ github.run_number }}
          prerelease: true
          files: auralis-debug.apk
