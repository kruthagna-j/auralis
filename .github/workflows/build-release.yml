# Workflow name
name: Flutter Release Builds
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which builds to run (all/android/linux/windows)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - linux
          - windows
#   push:
#     branches:
#       - main
#       - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build_android:
    name: Android APKs (all ABIs + universal)
    runs-on: ubuntu-latest
    # only run when not a manual dispatch or when targets include android/all
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'android' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/noize.keystore

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=noize.keystore" >> android/key.properties

      - name: Build APKs (split per ABI + universal)
        run: flutter build apk --release --split-per-abi

      - name: Generate SHA-256 checksums (Android)
        working-directory: build/app/outputs/flutter-apk
        run: |
          sha256sum app-release.apk > app-release.apk.sha256
          sha256sum app-armeabi-v7a-release.apk > app-armeabi-v7a-release.apk.sha256
          sha256sum app-arm64-v8a-release.apk > app-arm64-v8a-release.apk.sha256
          sha256sum app-x86_64-release.apk > app-x86_64-release.apk.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.sha256
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk.sha256

  build_linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'linux' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            libgstreamer-plugins-bad1.0-dev
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Archive and hash Linux bundle
        run: |
          tar -czf linux-release.tar.gz -C build/linux/x64/release bundle
          sha256sum linux-release.tar.gz > linux-release.tar.gz.sha256

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            linux-release.tar.gz
            linux-release.tar.gz.sha256

  build_windows:
    name: Windows release bundle
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'windows' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Create MSIX package (test certificate)
        run: |
          echo y | dart run msix:create

      - name: Generate SHA-256 checksum (MSIX)
        shell: pwsh
        run: |
          $msix = "build\windows\x64\runner\Release\Noize.msix"
          $hash = (Get-FileHash $msix -Algorithm SHA256).Hash
          "$hash  Noize.msix" | Out-File -Encoding utf8 "$msix.sha256"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/runner/Release/Noize.msix
            build/windows/x64/runner/Release/Noize.msix.sha256
